<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#f6f5fc" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#08090f" media="(prefers-color-scheme: dark)">
    <meta
      name="description"
      content="CineVault — личная библиотека фильмов и колесо случайного выбора. Вход по аккаунту, регистрация по приглашению."
    >
    <title>CineVault</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("cinevault-theme");
          const theme = saved === "light" || saved === "dark" ? saved : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <link rel="stylesheet" href="./src/styles.css">
    <link rel="stylesheet" href="./src/welcome.css">
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status" aria-live="polite">
        <span class="boot__halo" aria-hidden="true"></span>
        <span class="boot__stage" aria-hidden="true">
          <span class="boot__ring"></span>
          <span class="boot__mark"><b>CV</b></span>
        </span>
        <p class="boot__word" aria-hidden="true">
          <span style="--i:0">C</span><span style="--i:1">i</span><span style="--i:2">n</span
          ><span style="--i:3">e</span><span style="--i:4">V</span><span style="--i:5">a</span
          ><span style="--i:6">u</span><span style="--i:7">l</span><span style="--i:8">t</span>
        </p>
        <span class="boot__bar" aria-hidden="true"></span>
        <p class="sr-only">Открываем CineVault…</p>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
